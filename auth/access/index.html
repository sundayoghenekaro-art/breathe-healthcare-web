<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Breathe access</title><style>
:root{--ink:#102c2b;--muted:#667876;--teal:#0f7c73;--mint:#eaf8f5;--line:#dcebe8}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,#f5fbfa,#fff);min-height:100vh}.wrap{min-height:100vh;display:flex;flex-direction:column}.top{padding:24px 30px}.brand{font-weight:850;font-size:21px;color:var(--ink);text-decoration:none}.brand span{color:var(--teal)}main{width:min(520px,calc(100% - 28px));margin:auto;padding:20px 0 70px;flex:1}.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:32px;box-shadow:0 20px 60px rgba(16,44,43,.1);text-align:center}.icon{width:58px;height:58px;border-radius:17px;background:var(--mint);color:var(--teal);display:grid;place-items:center;font-size:28px;margin:0 auto 17px}.eyebrow{font-size:11px;letter-spacing:.1em;color:var(--teal);font-weight:850}.card h1{font-size:32px;letter-spacing:-.04em;margin:8px 0}.card p{color:var(--muted);font-size:14px}.field{text-align:left;margin:19px 0}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:7px}input{width:100%;padding:13px;border:1px solid #cfe1de;border-radius:12px;font:inherit}.btn{width:100%;border:0;border-radius:12px;padding:14px;background:var(--teal);color:#fff;font-weight:800;cursor:pointer}.switch{margin-top:18px;font-size:12px;color:var(--muted)}a{color:var(--teal);font-weight:800;text-decoration:none}.note{margin-top:20px;background:#f7fbfa;padding:13px;border-radius:12px;color:var(--muted);font-size:11px}.footer{text-align:center;padding:20px;color:#879390;font-size:11px}</style></head><body><div class="wrap"><header class="top"><a class="brand" href="/auth">Breathe <span>by TrikaHealth</span></a></header><main><div class="card"><div class="icon" id="icon">🔐</div><div class="eyebrow" id="eyebrow">SECURE ACCESS</div><h1 id="title">Sign in to Breathe</h1><p id="sub">Access your healthcare workspace securely.</p><div class="field"><label>Mobile number or email</label><input placeholder="+234 800 000 0000 or you@example.com"></div><div class="field" id="codeField" style="display:none"><label>Invitation code</label><input placeholder="e.g. BRTH-8K4P"></div><button class="btn" id="btn">Continue</button><div class="switch" id="switch">New to Breathe? <a href="/auth">Create an account</a></div><div class="note">Your access is protected by secure authentication. Clinical and organizational access is controlled by role and permission.</div></div></main><footer class="footer">© 2026 Trika Health · Privacy · Terms</footer></div><script>const invite=new URLSearchParams(location.search).get('mode')==='invite';if(invite){icon.textContent='✉️';eyebrow.textContent='ORGANIZATION INVITATION';title.textContent='Join your organization';sub.textContent='Enter the invitation details provided by your healthcare organization.';codeField.style.display='block';btn.textContent='Verify invitation';switchEl=switch;switchEl.innerHTML='Already have an account? <a href="/auth/access/?mode=login">Sign in</a>'}</script></body></html>
